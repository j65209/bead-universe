<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Bead Universe · Office 체험판</title>
<meta name="description" content="비드유니버스 사내 오피스 체험판 — 24시간 보기 전용">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Bead Universe">
<meta property="og:title" content="Bead Universe · Office 체험판">
<meta property="og:description" content="우리 회사 전산을 24시간 직접 눌러 보세요">
<meta property="og:image" content="https://beaduniverse.kr/og-symbol.png?v=1">
<link rel="icon" href="/favicon-32.png?v=2" sizes="32x32" type="image/png">
<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
<style>
:root{--bg:#fefcf5;--ink:#111;--sub:#86868b;--line:#e5e3dc;--warn:#ff3b30}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif}
body{display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:100%;max-width:360px;text-align:center}
.sym{width:72px;height:72px;margin:0 auto 18px;display:block}
h1{font-size:22px;letter-spacing:-.02em;margin:0 0 6px}
.lead{color:var(--sub);font-size:14px;margin:0 0 26px}
.msg{min-height:22px;font-size:13px;color:var(--sub)}
.msg.err{color:var(--warn)}
.rules{margin:26px 0 0;padding:16px 18px;border-top:1px solid var(--line);text-align:left;color:var(--sub);font-size:13px;list-style:none}
.rules li{padding:3px 0}
.rules li::before{content:'·';margin-right:8px;color:var(--ink)}
.end h1{margin-top:6px}
</style>
</head>
<body>
<div class="card" id="gate">
  <img class="sym" src="/symbol.svg" alt="" onerror="this.style.display='none'">
  <h1>오피스 체험판</h1>
  <p class="lead">비드유니버스가 매일 쓰는 사내 전산을 직접 눌러 보세요</p>
  <div class="msg" id="msg">여는 중…</div>
</div>
<script>
(function () {
  var SB = 'https://ckyjkxbqsyjoqpuqwoce.supabase.co';
  var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNreWpreGJxc3lqb3FwdXF3b2NlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0MjI2NzEsImV4cCI6MjA5Mzk5ODY3MX0.C8WIGqf-zIYkCq0dGWTMjIYuPM-IVInMn1p6FaWbVKA';
  var APP = 'https://j65209.github.io/beaduniverse/';
  var DEMO = location.origin + '/office/ad/demo/';
  var PFX = 'bbdemo::';
  var qs = new URLSearchParams(location.search);
  var msg = document.getElementById('msg');
  function get(k) { try { return localStorage.getItem(PFX + k); } catch (e) { return null; } }
  function set(k, v) { try { localStorage.setItem(PFX + k, v); } catch (e) { } }
  function del(k) { try { localStorage.removeItem(PFX + k); } catch (e) { } }

  function open() {
    return fetch(SB + '/rest/v1/rpc/office_demo_open', {
      method: 'POST', headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'content-type': 'application/json' }, body: '{}'
    }).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  }

  function ended() {
    document.getElementById('gate').innerHTML =
      '<img class="sym" src="/symbol.svg" alt="" onerror="this.style.display=\'none\'">' +
      '<div class="end"><h1>체험 시간이 끝났어요</h1><p class="lead">체험판은 24시간 동안만 열려요.<br>다시 보고 싶으시면 담당자에게 말씀해 주세요.</p></div>';
  }

  function boot() {
    var page = qs.get('p') || 'index.html';
    if (!/^[A-Za-z0-9_\-\/.]+\.html$/.test(page) || page.indexOf('..') >= 0 || /^erp\//.test(page)) page = 'index.html';   // 재고 ERP 는 체험판에서 막음
    var base = APP + page.replace(/[^/]*$/, '');
    msg.className = 'msg'; msg.textContent = '여는 중…';
    var guard = '<script>' +
      "['pushState','replaceState'].forEach(function(m){var o=history[m];history[m]=function(s,t,u){return o.call(history,s,t,u==null?u:new URL(String(u),location.href).href)}});" +
      "document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href^=\"#\"]');if(!a||e.defaultPrevented)return;e.preventDefault();if(a.getAttribute('href').length>1)location.hash=a.getAttribute('href');});" +
      '<\/script>';
    fetch(APP + page, { cache: 'no-cache' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status); return r.text();
    }).then(function (html) {
      html = html
        .replace(/<head[^>]*>/i, function (m) {
          return m + '<script src="' + DEMO + 'demo.js?v=4"><\/script><base href="' + base + '"><meta name="robots" content="noindex,nofollow">' + guard;
        })
        .replace('href="./agents.html"', 'href="' + DEMO + '?p=agents.html"')
        .replace('<a href="./">', '<a href="' + DEMO + '">')
        .replace(/`meta-ads\/report\.html\?/g, '`' + DEMO + '?p=meta-ads/report.html&')
        .replace(/<link[^>]+rel="manifest"[^>]*>/i, '');
      document.open(); document.write(html); document.close();
    }).catch(function () { msg.className = 'msg err'; msg.textContent = '화면을 불러오지 못했어요 · 새로고침해 주세요'; });
  }

  if (qs.get('expired')) { del('__exp'); ended(); return; }
  open().then(function (exp) {
    if (exp) { set('__exp', exp); boot(); } else { del('__exp'); ended(); }
  }).catch(function () { msg.className = 'msg err'; msg.textContent = '인터넷 연결을 확인해 주세요 · 새로고침해 주세요'; });
})();
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Bead Universe · Office 체험판</title>
<meta name="description" content="비드유니버스 사내 오피스 체험판 — 24시간 보기 전용">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Bead Universe">
<meta property="og:title" content="Bead Universe · Office 체험판">
<meta property="og:description" content="우리 회사 전산을 24시간 직접 눌러 보세요">
<meta property="og:image" content="https://beaduniverse.kr/og-symbol.png?v=1">
<link rel="icon" href="/favicon-32.png?v=2" sizes="32x32" type="image/png">
<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
<style>
:root{--bg:#fefcf5;--ink:#111;--sub:#86868b;--line:#e5e3dc;--warn:#ff3b30}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif}
body{display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:100%;max-width:360px;text-align:center}
.sym{width:72px;height:72px;margin:0 auto 18px;display:block}
h1{font-size:22px;letter-spacing:-.02em;margin:0 0 6px}
.lead{color:var(--sub);font-size:14px;margin:0 0 26px}
.pin{display:flex;gap:10px;justify-content:center;margin-bottom:14px}
.pin input{width:54px;height:62px;border:1.5px solid var(--line);border-radius:14px;background:#fff;text-align:center;font:700 24px/1 inherit;color:var(--ink);outline:none;-webkit-text-security:disc}
.pin input:focus{border-color:var(--ink)}
.msg{min-height:22px;font-size:13px;color:var(--sub)}
.msg.err{color:var(--warn)}
.rules{margin:26px 0 0;padding:16px 18px;border-top:1px solid var(--line);text-align:left;color:var(--sub);font-size:13px;list-style:none}
.rules li{padding:3px 0}
.rules li::before{content:'·';margin-right:8px;color:var(--ink)}
.end h1{margin-top:6px}
</style>
</head>
<body>
<div class="card" id="gate">
  <img class="sym" src="/symbol.svg" alt="" onerror="this.style.display='none'">
  <h1>오피스 체험판</h1>
  <p class="lead">비드유니버스가 매일 쓰는 사내 전산을 직접 눌러 보세요</p>
  <form class="pin" id="pinForm" autocomplete="off">
    <input inputmode="numeric" maxlength="1" aria-label="PIN 1">
    <input inputmode="numeric" maxlength="1" aria-label="PIN 2">
    <input inputmode="numeric" maxlength="1" aria-label="PIN 3">
    <input inputmode="numeric" maxlength="1" aria-label="PIN 4">
  </form>
  <div class="msg" id="msg">받으신 PIN 4자리를 넣어 주세요</div>
  <ul class="rules">
    <li>PIN 은 발급 뒤 24시간 동안만 쓸 수 있어요</li>
    <li>보기 전용 — 저장 · 수정은 되지 않아요</li>
    <li>매출 · 금액 · 단가와 고객 정보는 가려져 있어요</li>
  </ul>
</div>
<script>
(function () {
  var SB = 'https://ckyjkxbqsyjoqpuqwoce.supabase.co';
  var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNreWpreGJxc3lqb3FwdXF3b2NlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0MjI2NzEsImV4cCI6MjA5Mzk5ODY3MX0.C8WIGqf-zIYkCq0dGWTMjIYuPM-IVInMn1p6FaWbVKA';
  var APP = 'https://j65209.github.io/beaduniverse/';
  var DEMO = location.origin + '/office/ad/demo/';
  var PFX = 'bbdemo::';
  var qs = new URLSearchParams(location.search);
  var msg = document.getElementById('msg');
  function get(k) { try { return localStorage.getItem(PFX + k); } catch (e) { return null; } }
  function set(k, v) { try { localStorage.setItem(PFX + k, v); } catch (e) { } }
  function del(k) { try { localStorage.removeItem(PFX + k); } catch (e) { } }

  function check(pin) {
    return fetch(SB + '/rest/v1/rpc/office_demo_check', {
      method: 'POST', headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'content-type': 'application/json' },
      body: JSON.stringify({ p_pin: pin })
    }).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  }

  function ended() {
    document.getElementById('gate').innerHTML =
      '<img class="sym" src="/symbol.svg" alt="" onerror="this.style.display=\'none\'">' +
      '<div class="end"><h1>체험 시간이 끝났어요</h1><p class="lead">PIN 은 24시간 동안만 열려요.<br>다시 보고 싶으시면 담당자에게 새 PIN 을 받아 주세요.</p></div>';
  }

  function boot() {
    var page = qs.get('p') || 'index.html';
    if (!/^[A-Za-z0-9_\-\/.]+\.html$/.test(page) || page.indexOf('..') >= 0) page = 'index.html';
    var base = APP + page.replace(/[^/]*$/, '');
    msg.className = 'msg'; msg.textContent = '여는 중…';
    var guard = '<script>' +
      "['pushState','replaceState'].forEach(function(m){var o=history[m];history[m]=function(s,t,u){return o.call(history,s,t,u==null?u:new URL(String(u),location.href).href)}});" +
      "document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href^=\"#\"]');if(!a||e.defaultPrevented)return;e.preventDefault();if(a.getAttribute('href').length>1)location.hash=a.getAttribute('href');});" +
      '<\/script>';
    fetch(APP + page, { cache: 'no-cache' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status); return r.text();
    }).then(function (html) {
      html = html
        .replace(/<head[^>]*>/i, function (m) {
          return m + '<script src="' + DEMO + 'demo.js?v=1"><\/script><base href="' + base + '"><meta name="robots" content="noindex,nofollow">' + guard;
        })
        .replace('href="./agents.html"', 'href="' + DEMO + '?p=agents.html"')
        .replace('<a href="./">', '<a href="' + DEMO + '">')
        .replace(/`meta-ads\/report\.html\?/g, '`' + DEMO + '?p=meta-ads/report.html&')
        .replace(/<link[^>]+rel="manifest"[^>]*>/i, '');
      document.open(); document.write(html); document.close();
    }).catch(function () { msg.className = 'msg err'; msg.textContent = '화면을 불러오지 못했어요 · 새로고침해 주세요'; });
  }

  if (qs.get('expired')) { del('__pin'); del('__exp'); ended(); return; }

  var saved = get('__pin');
  if (saved) {
    msg.textContent = '확인 중…';
    check(saved).then(function (exp) {
      if (exp) { set('__exp', exp); boot(); } else { del('__pin'); del('__exp'); ended(); }
    }).catch(function () { msg.className = 'msg err'; msg.textContent = '인터넷 연결을 확인해 주세요'; });
    return;
  }

  var box = Array.prototype.slice.call(document.querySelectorAll('.pin input'));
  box[0].focus();
  function val() { return box.map(function (i) { return i.value; }).join(''); }
  function clear() { box.forEach(function (i) { i.value = ''; }); box[0].focus(); }
  var busy = false;
  function submit() {
    var pin = val(); if (pin.length < 4 || busy) return;
    busy = true; msg.className = 'msg'; msg.textContent = '확인 중…';
    check(pin).then(function (exp) {
      busy = false;
      if (!exp) { msg.className = 'msg err'; msg.textContent = 'PIN 이 맞지 않거나 기한이 지났어요'; clear(); return; }
      set('__pin', pin); set('__exp', exp); boot();
    }).catch(function () { busy = false; msg.className = 'msg err'; msg.textContent = '인터넷 연결을 확인해 주세요'; });
  }
  box.forEach(function (inp, i) {
    inp.addEventListener('input', function () {
      inp.value = inp.value.replace(/\D/g, '').slice(-1);
      if (inp.value && i < box.length - 1) box[i + 1].focus();
      submit();
    });
    inp.addEventListener('keydown', function (e) { if (e.key === 'Backspace' && !inp.value && i > 0) { box[i - 1].focus(); box[i - 1].value = ''; } });
    inp.addEventListener('paste', function (e) {
      var t = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 4); if (!t) return;
      e.preventDefault(); box.forEach(function (b, j) { b.value = t[j] || ''; }); submit();
    });
  });
  document.getElementById('pinForm').addEventListener('submit', function (e) { e.preventDefault(); submit(); });
})();
</script>
</body>
</html>
